# Map to handle WebSocket upgrades securely - only allow 'websocket' value
# Explicitly block h2c to prevent H2C smuggling attacks
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
    # Explicitly reject h2c upgrades (case-insensitive)
    ~*^h2c$ '';
    # Only allow websocket upgrades
    ~^websocket$ upgrade;
}

# Additional map to validate upgrade requests and block h2c
map $http_upgrade $upgrade_validated {
    default 0;
    '' 1;
    ~^websocket$ 1;
    ~*^h2c$ 0;
}

# Plain HTTP exists only to send callers to TLS.  Nothing is served here.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # TLS.  The port does NOT generate these -- a certificate a package
    # manufactured for you is a certificate no client should trust.  Install a
    # real one (acme.sh, security/py-certbot, or your own CA) at these paths,
    # or point these directives elsewhere.  nginx refuses to start until they
    # exist, which is the correct failure: a management console must not come
    # up in cleartext because a certificate was missing.
    ssl_certificate     %%PREFIX%%/etc/sysmanage/tls/server.crt;
    ssl_certificate_key %%PREFIX%%/etc/sysmanage/tls/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SysManageTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # The agents and the UI both talk only to this host over TLS, so pinning
    # HSTS here is safe and keeps a stray http:// link from leaking a session.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Inventory payloads from large fleets exceed the 1m default.
    client_max_body_size 32m;

    # Air-gap repository mirror served to air-gapped agents (apt/dnf/zypper)
    # when this host runs as an Air-Gap Repository.  The ingest registration
    # records a repo_url pointing here on this same webui port; the tree is
    # simply empty/absent on non-repository hosts.
    location /airgap-repo/ {
        alias /var/db/sysmanage/airgap-repo/;
        autoindex off;
        # Repo metadata (Release/InRelease/Packages) is extension-less.
        default_type application/octet-stream;
    }

    # Frontend static files
    location / {
        root %%PREFIX%%/www/sysmanage;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # nginx add_header does NOT merge across levels: declaring any
            # add_header here discards every header inherited from the server
            # block, so the security headers must be repeated or the static
            # assets -- most of the application -- ship without them.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "same-origin" always;
        }
    }

    # Proxy API requests to backend
    location /api/ {
        # Block invalid upgrade requests (including h2c) before proxying
        if ($upgrade_validated = 0) {
            return 400 "Invalid upgrade request";
        }

        proxy_pass http://127.0.0.1:8080;
        # H2C smuggling mitigated by upgrade_validated check above
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Host header safe: local reverse proxy with validated upstream
        proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # WebSocket support
        proxy_read_timeout 86400;
    }

    # Proxy WebSocket connections
    location /ws {
        # Block invalid upgrade requests (including h2c) before proxying
        if ($upgrade_validated = 0) {
            return 400 "Invalid upgrade request";
        }

        proxy_pass http://127.0.0.1:8080;
        # H2C smuggling mitigated by upgrade_validated check above
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Host header safe: local reverse proxy with validated upstream
        proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
