# GENERATED FILE - DO NOT EDIT THE PER-PLATFORM COPIES.
#
# Edit installer/nginx/sysmanage-nginx.conf.template and run
#     python3 scripts/render_nginx_configs.py
# `make lint` fails if any platform copy has drifted from this template.
#
# ONE PORT
# ========
# Everything SysManage exposes lives on 443: the web UI at /, the REST API
# under /api/, and the agent WebSocket under /ws and /api/agent/connect.  Port
# 80 exists only to redirect to 443.  The backend listens on loopback 8080 and
# is never reachable from outside this host.
#
# That is the whole firewall requirement, for agents and operators alike:
# inbound 443 on this host, outbound 443 from each agent.  No API port, no
# separate WebSocket port, no enrollment port.

# Map to handle WebSocket upgrades securely - only allow 'websocket' value
# Explicitly block h2c to prevent H2C smuggling attacks
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
    # Explicitly reject h2c upgrades (case-insensitive)
    ~*^h2c$ '';
    # Only allow websocket upgrades
    ~^websocket$ upgrade;
}

# Additional map to validate upgrade requests and block h2c
map $http_upgrade $upgrade_validated {
    default 0;
    '' 1;
    ~^websocket$ 1;
    ~*^h2c$ 0;
}

# Plain HTTP exists to send callers to TLS.  The only things served here are
# the air-gap package trees (25.9): an air-gapped host's package manager
# fetches them over plain HTTP (it has no reason to trust this server's
# certificate), the trees hold nothing secret, and every client checks what
# it gets by signature -- apk's RSA-signed APKINDEX, apt's InRelease, rpm-md's
# repomd.xml.asc, pkg's signed catalog.  Everything else is redirected.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location ^~ /airgap-repo/ {
        alias /var/lib/sysmanage/airgap-repo/;
        autoindex off;
        default_type application/octet-stream;
    }

    location ^~ /airgap-tools/ {
        alias /var/lib/sysmanage/airgap-tools/;
        autoindex off;
        default_type application/octet-stream;
    }

    # The redirect below interpolates the client's own Host header, so a
    # request carrying a forged one is bounced to that name.  Accepted
    # deliberately: this is a catch-all sample and the package cannot know your
    # FQDN, so the alternative would redirect to the literal "_".  An attacker
    # can only redirect THEMSELVES this way -- the redirect is not stored and no
    # session or credential rides on it.
    #
    # It stops being harmless behind a CACHING reverse proxy, which can store
    # the 301 keyed on path alone and then serve an attacker's destination to
    # everyone else.  If anything caches in front of this server, name this
    # vhost explicitly and let the request header play no part:
    #
    #     server_name console.example.com;
    #     return 301 https://$server_name$request_uri;
    #
    location / {
        # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 on the listen line, not the `http2 on;` directive: that directive
    # only exists from nginx 1.25.1, and Ubuntu 24.04 ships 1.24, Debian 12
    # 1.22, RHEL 9 1.20 and Ubuntu 22.04 1.18 -- on every one of them
    # `nginx -t` failed with 'unknown directive "http2"' and nginx would not
    # start (found on a fresh Ubuntu 24.04 install, 2026-11-05).  This form
    # works on every nginx since 1.9.5; 1.25.1 and later only warn that it is
    # deprecated.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # TLS.  The package does NOT generate these -- a certificate a package
    # manufactured for you is a certificate no client should trust, and an agent
    # that verifies certificates (the default) would refuse it anyway.  Install a
    # real one (certbot, acme.sh, or your own CA) at these paths, or point these
    # directives elsewhere.  nginx refuses to start until they exist, which is
    # the correct failure: a management console must not come up in cleartext
    # because a certificate was missing.
    ssl_certificate     /usr/local/etc/sysmanage/tls/server.crt;
    ssl_certificate_key /usr/local/etc/sysmanage/tls/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    # AEAD only: no CBC suites (Lucky Thirteen, CVE-2013-0169, and its
    # successors).  Same list as the server's own (backend/security/tls_policy.py);
    # TLS 1.3 suites are all AEAD and are not affected by this line.
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SysManageTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Agent mutual TLS.  The package writes this file once the SysManage CA
    # exists (its post-install step); until then the pattern matches nothing
    # and nginx asks no client for a certificate.  The file holds two lines:
    #     ssl_verify_client optional_no_ca;
    #     ssl_client_certificate <the SysManage CA>;
    # nginx then asks every client for a certificate but advertises only the
    # SysManage CA, so browsers -- which hold no certificate from it -- are
    # never prompted.  nginx proves the agent holds the key; the backend checks
    # the rest (issuer, expiry, host, serial) and enforces per tenant.
    include /usr/local/etc/sysmanage/nginx/agent-mtls*.conf;

    # The agents and the UI both talk only to this host over TLS, so pinning
    # HSTS here is safe and keeps a stray http:// link from leaking a session.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # strict-origin-when-cross-origin, not same-origin: the host map loads
    # tiles from tile.openstreetmap.org, whose usage policy blocks requests
    # with no Referer (HTTP 403 "access blocked").  This sends only the
    # origin cross-site -- never a path or query.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Inventory payloads from large fleets exceed the 1m default.
    client_max_body_size 32m;

    # Air-gap repository mirror served to air-gapped agents (apt/dnf/zypper)
    # when this host runs as an Air-Gap Repository.  The ingest registration
    # records a repo_url pointing here on this same port; the tree is simply
    # empty/absent on non-repository hosts.
    location /airgap-repo/ {
        alias /var/lib/sysmanage/airgap-repo/;
        autoindex off;
        # Repo metadata (Release/InRelease/Packages) is extension-less.
        default_type application/octet-stream;
    }

    # The SysManage tools repository (25.9): the agent, restate and restate-proxy,
    # signed with the site's own key (services/airgap_tools.py).
    location /airgap-tools/ {
        alias /var/lib/sysmanage/airgap-tools/;
        autoindex off;
        default_type application/octet-stream;
    }

    # Frontend static files
    location / {
        root /usr/local/lib/sysmanage/frontend/dist;
        try_files $uri $uri/ /index.html;

        # index.html names the hashed bundles, so it must never be cached:
        # a browser holding an old copy keeps running the previous release's
        # JavaScript against the new API after an upgrade.  The SPA fallback
        # above lands here too.  (add_header replaces the inherited headers,
        # so the security headers are repeated -- see below.)
        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # nginx add_header does NOT merge across levels: declaring any
            # add_header here discards every header inherited from the server
            # block, so the security headers must be repeated or the static
            # assets -- most of the application -- ship without them.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }

    # Proxy API requests to backend
    location /api/ {
        # Block invalid upgrade requests (including h2c) before proxying
        if ($upgrade_validated = 0) {
            return 400 "Invalid upgrade request";
        }

        proxy_pass http://127.0.0.1:8080;
        # H2C smuggling mitigated by upgrade_validated check above
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Host header safe: local reverse proxy with validated upstream
        proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The agent's client certificate (URL-escaped PEM), or nothing.  Always
        # set from nginx's own variable, so a client cannot send this header.
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_cache_bypass $http_upgrade;

        # WebSocket support
        proxy_read_timeout 86400;
    }

    # Proxy WebSocket connections
    location /ws {
        # Block invalid upgrade requests (including h2c) before proxying
        if ($upgrade_validated = 0) {
            return 400 "Invalid upgrade request";
        }

        proxy_pass http://127.0.0.1:8080;
        # H2C smuggling mitigated by upgrade_validated check above
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Host header safe: local reverse proxy with validated upstream
        proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The agent's client certificate (URL-escaped PEM), or nothing.  Always
        # set from nginx's own variable, so a client cannot send this header.
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;

        # WebSocket timeouts
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
