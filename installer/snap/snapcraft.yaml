name: sysmanage
base: core22
version: git
summary: Centralized system management server with web-based interface
description: |
  SysManage is a comprehensive centralized system management server with a
  modern web-based interface. It provides:

  * Agent management and monitoring
  * System metrics and health monitoring
  * Comprehensive reporting system with PDF generation
  * JWT-based authentication with mTLS security
  * Multi-user management system with RBAC
  * Package inventory and updates
  * Certificate management
  * Real-time WebSocket communication
  * Cross-platform support (Linux, Windows, macOS, FreeBSD, OpenBSD)

  The server runs as a service and communicates with SysManage agents
  deployed across your infrastructure to provide centralized management.

license: AGPL-3.0
website: https://sysmanage.org
source-code: https://github.com/bceverly/sysmanage
issues: https://github.com/bceverly/sysmanage/issues
contact: https://github.com/bceverly/sysmanage/issues

icon: snap/gui/icon.svg

grade: stable
confinement: strict

architectures:
  - build-on: amd64

apps:
  sysmanage:
    command: bin/sysmanage-wrapper
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    plugs:
      - network
      - network-bind

parts:
  python310:
    plugin: nil
    source: https://www.python.org/ftp/python/3.10.15/Python-3.10.15.tgz
    source-checksum: sha256/a27864e5ba2a4474f8f6c58ab92ff52767ac8b66f1646923355a53fe3ef15074
    build-attributes:
      - enable-patchelf
    build-packages:
      - build-essential
      - libssl-dev
      - zlib1g-dev
      - libncurses5-dev
      - libncursesw5-dev
      - libreadline-dev
      - libsqlite3-dev
      - libgdbm-dev
      - libdb-dev
      - libbz2-dev
      - libexpat1-dev
      - liblzma-dev
      - libffi-dev
      - uuid-dev
      - wget
    override-build: |
      ./configure --prefix=/usr --enable-optimizations --enable-shared LDFLAGS="-Wl,-rpath,/usr/lib"
      make -j$(nproc)
      make DESTDIR=$CRAFT_PART_INSTALL install
      # Ensure shared libraries can be found
      ldconfig -n $CRAFT_PART_INSTALL/usr/lib || true

  backend:
    after: [python310]
    plugin: nil
    build-packages:
      - libpq-dev
      - gcc
      - g++
      - libffi-dev
      - libssl-dev
      - rsync
      - git
    override-build: |
      # $CRAFT_PROJECT_DIR is the project root when running snapcraft from root with path to snapcraft.yaml
      # Create temp build directory
      mkdir -p /tmp/build

      # Copy only the files and directories we need using cp with exclusions
      cp "$CRAFT_PROJECT_DIR/requirements.txt" /tmp/build/
      cp -r "$CRAFT_PROJECT_DIR/scripts" /tmp/build/
      cp -r "$CRAFT_PROJECT_DIR/backend" /tmp/build/
      # Stamp the version into backend/__init__.py so backend.__version__
      # resolves at runtime (server-info + federation "Reported version" show
      # it instead of "unknown"); the checkout ships it empty.
      VER="$(git -C "$CRAFT_PROJECT_DIR" describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
      [ -n "$VER" ] || VER="${CRAFT_PROJECT_VERSION:-0.0.0}"
      printf '__version__ = "%s"\n' "$VER" > /tmp/build/backend/__init__.py
      cp -r "$CRAFT_PROJECT_DIR/alembic" /tmp/build/
      cp "$CRAFT_PROJECT_DIR/alembic.ini" /tmp/build/
      cp -r "$CRAFT_PROJECT_DIR/config" /tmp/build/
      cp "$CRAFT_PROJECT_DIR/sysmanage.yaml.example" /tmp/build/config/

      # Copy requirements-prod.txt if it exists
      if [ -f "$CRAFT_PROJECT_DIR/requirements-prod.txt" ]; then
        cp "$CRAFT_PROJECT_DIR/requirements-prod.txt" /tmp/build/
      fi

      # Generate requirements-prod.txt if it doesn't exist
      if [ ! -f "/tmp/build/requirements-prod.txt" ]; then
        cd /tmp/build
        python3 scripts/update-requirements-prod.py
      fi

      # Install Python packages using our compiled Python 3.10
      export LD_LIBRARY_PATH=$CRAFT_STAGE/usr/lib:${LD_LIBRARY_PATH:-}
      export PYTHONHASHSEED=0
      $CRAFT_STAGE/usr/bin/python3.10 -m pip install --no-cache-dir --target=$CRAFT_PART_INSTALL/lib/python3.10/site-packages \
        -r /tmp/build/requirements-prod.txt

      # Copy application files
      mkdir -p $CRAFT_PART_INSTALL/app
      cp -r /tmp/build/backend $CRAFT_PART_INSTALL/app/
      cp -r /tmp/build/alembic $CRAFT_PART_INSTALL/app/
      cp /tmp/build/alembic.ini $CRAFT_PART_INSTALL/app/
      cp -r /tmp/build/config $CRAFT_PART_INSTALL/app/
      cp -r /tmp/build/scripts $CRAFT_PART_INSTALL/app/

  frontend:
    plugin: nil
    build-packages:
      - curl
    override-build: |
      # Install Node.js 20.x
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get install -y nodejs

      # Copy frontend source
      cp -r "$CRAFT_PROJECT_DIR/frontend" /tmp/frontend-build
      cd /tmp/frontend-build

      # Install dependencies and build
      npm ci
      npm run build

      # Copy built frontend to install directory
      mkdir -p $CRAFT_PART_INSTALL/app/frontend
      cp -r dist $CRAFT_PART_INSTALL/app/frontend/
      cp -r public $CRAFT_PART_INSTALL/app/frontend/

  wrapper:
    plugin: nil
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/bin
      cat > $CRAFT_PART_INSTALL/bin/sysmanage-wrapper <<'EOF'
      #!/bin/bash
      set -e

      # Set up environment using snap-specific paths
      # $SNAP_DATA: writable per-revision data (/var/snap/sysmanage/current)
      # $SNAP_COMMON: writable common data (/var/snap/sysmanage/common)
      export SYSMANAGE_CONFIG_PATH="${SYSMANAGE_CONFIG_PATH:-$SNAP_COMMON/sysmanage.yaml}"
      export SYSMANAGE_CERT_PATH="${SYSMANAGE_CERT_PATH:-$SNAP_COMMON/certs}"
      export SYSMANAGE_LOG_DIR="${SYSMANAGE_LOG_DIR:-$SNAP_COMMON/logs}"
      export PYTHONPATH="$SNAP/app:$SNAP/lib/python3.10/site-packages"
      export LD_LIBRARY_PATH="$SNAP/usr/lib:$LD_LIBRARY_PATH"

      # Ensure directories exist
      mkdir -p "$SYSMANAGE_CERT_PATH"
      mkdir -p "$SYSMANAGE_LOG_DIR"

      # Check for config file, copy example if missing (but don't overwrite existing)
      if [ ! -f "$SYSMANAGE_CONFIG_PATH" ]; then
        echo "Configuration file not found at $SYSMANAGE_CONFIG_PATH"
        echo "Creating from example template..."
        cp "$SNAP/app/config/sysmanage.yaml.example" "$SYSMANAGE_CONFIG_PATH"
        echo ""
        echo "WARNING: Using default configuration. Edit the config file:"
        echo "  $SYSMANAGE_CONFIG_PATH"
        echo ""
        echo "Recommended changes:"
        echo "  - Database connection settings"
        echo "  - JWT secret key"
        echo ""
      fi

      # Set up nginx directories in writable snap locations
      mkdir -p $SNAP_DATA/nginx/logs
      mkdir -p $SNAP_DATA/nginx/run
      mkdir -p $SNAP_DATA/nginx/tmp/client_body
      mkdir -p $SNAP_DATA/nginx/tmp/proxy
      mkdir -p $SNAP_DATA/nginx/tmp/fastcgi
      mkdir -p $SNAP_DATA/nginx/tmp/uwsgi
      mkdir -p $SNAP_DATA/nginx/tmp/scgi
      mkdir -p $SNAP_DATA/tls
      mkdir -p $SNAP_DATA/airgap-repo

      # TLS certificate.  The shared config serves on 443 and nginx REFUSES TO
      # START without a certificate -- deliberate, so a management console can
      # never come up in cleartext because a cert was missing.  A snap has no
      # packaging-time hook to generate one and no operator prompt, so mint a
      # self-signed cert on first run.  Replace it with a real one via
      #   snap run --shell sysmanage   (files live in $SNAP_DATA/tls)
      if [ ! -f $SNAP_DATA/tls/server.crt ] || [ ! -f $SNAP_DATA/tls/server.key ]; then
        echo "Generating a self-signed TLS certificate for first run..."
        $SNAP/usr/bin/openssl req -x509 -nodes -newkey rsa:2048 -days 825 \
          -keyout $SNAP_DATA/tls/server.key \
          -out $SNAP_DATA/tls/server.crt \
          -subj "/CN=$(hostname -f 2>/dev/null || hostname)" \
          -addext "subjectAltName=DNS:$(hostname -f 2>/dev/null || hostname),DNS:localhost,IP:127.0.0.1" \
          >/dev/null 2>&1 || echo "WARNING: could not generate a TLS certificate; nginx will not start"
        chmod 600 $SNAP_DATA/tls/server.key 2>/dev/null || true
        echo "Self-signed certificate written to $SNAP_DATA/tls/server.crt"
        echo "Browsers will warn until you install a trusted certificate there."
      fi

      # Server block: rendered from the SHARED template at build time and shipped
      # in the snap, so it cannot drift from the other platforms.  It carries
      # %%SNAP%% / %%SNAP_DATA%% tokens because a snap's real paths are only known
      # at runtime.  Substitute ONLY those tokens -- nginx's own $http_upgrade,
      # $host and $uri must survive verbatim, which is why this is a targeted sed
      # and not envsubst.
      sed -e "s|%%SNAP_DATA%%|$SNAP_DATA|g" -e "s|%%SNAP%%|$SNAP|g" \
        $SNAP/app/nginx/sysmanage-nginx.conf > $SNAP_DATA/nginx/sysmanage-nginx.conf

      # Create nginx config that uses snap paths
      cat > $SNAP_DATA/nginx/nginx.conf <<NGINXCONF
      # Run as root in snap environment (snap handles user isolation)
      user root;
      daemon off;
      error_log $SNAP_DATA/nginx/logs/error.log;
      pid $SNAP_DATA/nginx/run/nginx.pid;

      events {
          worker_connections 1024;
      }

      http {
          include $SNAP/etc/nginx/mime.types;
          default_type application/octet-stream;
          access_log $SNAP_DATA/nginx/logs/access.log;

          # Configure temp paths to use writable snap directories
          client_body_temp_path $SNAP_DATA/nginx/tmp/client_body;
          proxy_temp_path $SNAP_DATA/nginx/tmp/proxy;
          fastcgi_temp_path $SNAP_DATA/nginx/tmp/fastcgi;
          uwsgi_temp_path $SNAP_DATA/nginx/tmp/uwsgi;
          scgi_temp_path $SNAP_DATA/nginx/tmp/scgi;

          # Server blocks (TLS on 443, 80 -> 301 redirect, /api/, /ws,
          # /airgap-repo/) plus the WebSocket upgrade maps come from the shared
          # template, substituted into $SNAP_DATA above.  Do not inline them here
          # again: a hand-written copy is exactly how this snap ended up serving
          # the console over cleartext on port 3000 while every other platform
          # had moved to TLS.
          include $SNAP_DATA/nginx/sysmanage-nginx.conf;

      }
      NGINXCONF

      # Function to handle cleanup on exit
      cleanup() {
        echo "Shutting down services..."
        if [ ! -z "$BACKEND_PID" ]; then
          kill $BACKEND_PID 2>/dev/null || true
        fi
        if [ ! -z "$NGINX_PID" ]; then
          kill $NGINX_PID 2>/dev/null || true
        fi
        if [ ! -z "$OPENBAO_PID" ]; then
          kill $OPENBAO_PID 2>/dev/null || true
        fi
        exit 0
      }

      # Set up signal handlers
      trap cleanup SIGTERM SIGINT

      # Start OpenBAO (local secrets broker) before the backend.
      mkdir -p $SNAP_DATA/openbao/data
      cat > $SNAP_DATA/openbao/openbao.hcl <<BAOCONF
      storage "file" {
        path = "$SNAP_DATA/openbao/data"
      }
      listener "tcp" {
        address     = "127.0.0.1:8200"
        tls_disable = "true"
      }
      api_addr      = "http://127.0.0.1:8200"
      disable_mlock = true
      ui            = false
      BAOCONF
      if [ -x "$SNAP/bin/bao" ]; then
        $SNAP/bin/bao server -config=$SNAP_DATA/openbao/openbao.hcl &
        OPENBAO_PID=$!
        echo "OpenBAO started with PID $OPENBAO_PID"
        $SNAP/usr/bin/python3.10 $SNAP/app/scripts/openbao_init_unseal.py \
          --addr http://127.0.0.1:8200 --keyfile $SNAP_DATA/openbao/init.json || \
          echo "OpenBAO init/unseal did not complete"
      fi

      # Start the backend in the background
      cd $SNAP/app
      $SNAP/usr/bin/python3.10 -m backend.main &
      BACKEND_PID=$!
      echo "Backend started with PID $BACKEND_PID"

      # Give backend a moment to start listening
      sleep 2

      # Start nginx in the background
      $SNAP/usr/sbin/nginx -c $SNAP_DATA/nginx/nginx.conf &
      NGINX_PID=$!
      echo "Nginx started with PID $NGINX_PID"

      # Wait for both processes
      # If either exits, the wrapper will exit and snapd will restart it
      wait -n
      cleanup
      EOF
      chmod +x $CRAFT_PART_INSTALL/bin/sysmanage-wrapper

  openbao:
    plugin: nil
    build-packages:
      - wget
    override-build: |
      # Stage the static OpenBAO binary (secrets broker).  OpenBAO ships no
      # snap; the static Linux binary runs fine inside the snap.
      mkdir -p $CRAFT_PART_INSTALL/bin
      OPENBAO_VERSION=2.5.4
      wget -qO /tmp/bao.tgz \
        "https://github.com/openbao/openbao/releases/download/v${OPENBAO_VERSION}/bao_${OPENBAO_VERSION}_Linux_x86_64.tar.gz"
      tar -xzf /tmp/bao.tgz -C $CRAFT_PART_INSTALL/bin bao
      chmod +x $CRAFT_PART_INSTALL/bin/bao
      rm -f /tmp/bao.tgz

  nginx:
    plugin: nil
    stage-packages:
      - nginx-light
      # openssl is used by the wrapper to mint a self-signed certificate on first
      # run.  The shared config serves on 443 and nginx refuses to start without
      # one, and a confined snap has no packaging hook or operator prompt to
      # supply it -- so the tool has to be inside the snap.
      - openssl
    override-build: |
      craftctl default
      # Remove default nginx files we don't need
      rm -rf $CRAFT_PART_INSTALL/etc/nginx/sites-*
      rm -rf $CRAFT_PART_INSTALL/var

      # Ship the server block rendered from the SHARED template (see
      # scripts/render_nginx_configs.py, platform "snap").  The wrapper
      # substitutes its %%SNAP%% / %%SNAP_DATA%% tokens at runtime.  Keeping this
      # a real file staged from the repo -- rather than a heredoc in this
      # YAML -- is what puts the snap inside the config drift gate.
      mkdir -p $CRAFT_PART_INSTALL/app/nginx
      cp "$CRAFT_PROJECT_DIR/installer/snap/sysmanage-nginx.conf" \
         $CRAFT_PART_INSTALL/app/nginx/sysmanage-nginx.conf
